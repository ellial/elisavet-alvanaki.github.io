name: Deploy static site to GitHub Pages

# GitHub Pages serves this site from the gh-pages branch. This workflow keeps
# gh-pages in sync with main, so pushing to main is all that's needed to deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish main to gh-pages
        run: git push --force origin HEAD:gh-pages
